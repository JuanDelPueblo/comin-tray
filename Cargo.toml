[package]
name = "comin-tray"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small StatusNotifierItem tray for Comin"
repository = "https://github.com/JuanDelPueblo/comin-tray"

[dependencies]
anyhow = "1"
ksni = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
zbus = { version = "5", features = ["tokio"] }
